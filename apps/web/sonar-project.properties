sonar.projectKey=dataspace-marketplace
sonar.projectName=dataspace-marketplace
sonar.projectVersion=0.1.0
# sonar.scm.provider=git

sonar.sources=src
sonar.tests=src/lib/utils/__tests__,src/lib/validations/__tests__,src/lib/services/queries/__tests__

sonar.sourceEncoding=UTF-8

sonar.typescript.tsconfigPaths=tsconfig.json

sonar.exclusions=\
**/*.test.ts,\
**/*.spec.ts,\
**/*.test.tsx,\
**/*.spec.tsx,\
**/__tests__/**,\
**/node_modules/**,\
**/.next/**,\
**/coverage/**,\
**/dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info


