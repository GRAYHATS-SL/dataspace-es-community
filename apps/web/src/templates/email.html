<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{subject}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #111827">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f3f4f6; padding: 32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 12px; overflow: hidden">
            <tr>
              <td style="background-color: #1f2937; padding: 24px 32px; color: #ffffff; font-size: 20px; font-weight: bold">
                {{appName}}
              </td>
            </tr>
            <tr>
              <td style="padding: 32px">
                <h1 style="margin: 0 0 16px; font-size: 22px; color: #1f2937">{{heading}}</h1>
                <div style="font-size: 15px; line-height: 1.6; color: #374151">{{body}}</div>
                <!-- Optional call to action: leave ctaUrl/ctaLabel empty to hide the button -->
                <div style="margin-top: 24px; {{ctaStyle}}">
                  <a href="{{ctaUrl}}" style="display: inline-block; background-color: #1f2937; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 9999px; font-weight: bold">{{ctaLabel}}</a>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px; background-color: #f9fafb; font-size: 12px; color: #6b7280">
                © {{year}} {{appName}}. {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
