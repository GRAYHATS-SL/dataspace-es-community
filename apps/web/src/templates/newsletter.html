<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva suscripción al newsletter</title>
</head>

<body style="margin:0; padding:0; background-color:#f2f5f9; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0; background-color:#f2f5f9;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
          style="background-color:#fff; border-radius:16px; overflow:hidden; box-shadow:0 2px 12px rgba(8,0,134,0.06);">
          <tr>
            <td style="padding:32px 48px 40px 48px; color:#0c0c0d; font-size:15px; line-height:1.7;">
              <p style="margin-top:0; margin-bottom:28px;">Un usuario se ha suscrito al newsletter de Dataspace.es.</p>
              <div
                style="margin-bottom:32px; padding:24px; background-color:#f2f5f9; border-radius:16px; box-shadow:0 1px 4px rgba(8,0,134,0.04);">
                <div style="font-size:13px; margin-bottom:8px; color:#080086;"><strong>Email suscrito:</strong></div>
                <div style="font-size:14px; margin-bottom:20px; word-break:break-all; color:#0c0c0d;">{{email}}</div>
                <div style="font-size:13px; margin-bottom:8px; color:#080086;"><strong>Fecha:</strong></div>
                <div style="font-size:14px; color:#0c0c0d;">{{fecha}}</div>
              </div>
            </td>
          </tr>
          <tr>
            <td
              style="padding:24px; text-align:center; font-size:12px; color:#75787b; background-color:#fff; border-top:1px solid #e5e7eb;">
              © {{year}} Dataspace.es · Notificación interna automática</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
