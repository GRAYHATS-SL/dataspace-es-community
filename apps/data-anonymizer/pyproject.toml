[project]
name = "data-anonymizer"
version = "1.0.0"
description = "API para anonimizar JSON, texto libre y metadatos de imagenes, PDF, audio y video"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["anonymization", "anonimizacion", "pii", "gdpr", "rgpd", "privacy", "metadata", "exif"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0",
    "Pillow>=10.4",
    "pikepdf>=9.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
# Reconocimiento de entidades (nombres, lugares, organizaciones) con spaCy.
# Ademas hay que descargar un modelo: python -m spacy download es_core_news_md
ner = ["spacy>=3.7,<4"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_anonymizer*"]

[tool.setuptools.package-data]
"data_anonymizer.pii" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ffmpeg: necesita ffmpeg/ffprobe instalados (se saltan si no estan)",
    "ner: necesita spaCy y el modelo es_core_news_sm (se saltan si no estan)",
]

[tool.coverage.run]
source = ["data_anonymizer"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # comentarios y textos en espanol: tildes, º, ª, comillas tipograficas
]

[tool.ruff.lint.per-file-ignores]
# FastAPI declara parametros con Query()/File()/Depends(): patron del framework.
"data_anonymizer/main.py" = ["B008"]
